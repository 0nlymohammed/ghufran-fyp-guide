# Campus Portal. Order: Secret, then all Services, then all Deployments.
# Services come first so every pod gets the *_SERVICE_PORT env vars (used in attack step 2).
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: campus
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres      # vendor default ON PURPOSE (attack step 3)
  POSTGRES_DB: campus
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: campus
spec:
  type: NodePort
  externalTrafficPolicy: Local     # keep the client IP, so Cilium sees it as "world"
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: news
  namespace: campus
spec:
  selector:
    app: news
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: campus
spec:
  selector:
    app: api
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: campus
spec:
  selector:
    app: auth
  ports:
  - port: 5001
    targetPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: campus
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: campus
spec:
  selector:
    app: admin
  ports:
  - port: 5002
    targetPort: 5002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        tier: frontend
      containers:
      - name: frontend
        image: nginx:1.28
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
        volumeMounts:
        - name: files
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: files
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: files
        configMap:
          name: frontend-files
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news
  template:
    metadata:
      labels:
        app: news
    spec:
      nodeSelector:
        tier: frontend
      automountServiceAccountToken: false   # the attacker gets no Kubernetes API token
      containers:
      - name: news
        image: campus-news:1.0
        imagePullPolicy: Never
        command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "news:app"]
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      nodeSelector:
        tier: backend
      containers:
      - name: api
        image: campus-app:1.0
        imagePullPolicy: Never
        command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "2", "api:app"]
        envFrom:
        - secretRef:
            name: db-credentials
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      nodeSelector:
        tier: backend
      containers:
      - name: auth
        image: campus-app:1.0
        imagePullPolicy: Never
        command: ["gunicorn", "--bind", "0.0.0.0:5001", "--workers", "2", "auth:app"]
        envFrom:
        - secretRef:
            name: db-credentials
        ports:
        - containerPort: 5001
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      nodeSelector:
        tier: backend
      containers:
      - name: db
        image: postgres:17
        envFrom:
        - secretRef:
            name: db-credentials
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
        volumeMounts:
        - name: init
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: init
        configMap:
          name: db-init
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      nodeSelector:
        tier: backend
      containers:
      - name: admin
        image: campus-app:1.0
        imagePullPolicy: Never
        command: ["gunicorn", "--bind", "0.0.0.0:5002", "--workers", "2", "admin:app"]
        envFrom:
        - secretRef:
            name: db-credentials
        ports:
        - containerPort: 5002
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops
  template:
    metadata:
      labels:
        app: ops
    spec:
      nodeSelector:
        tier: backend
      terminationGracePeriodSeconds: 1      # sleep ignores the stop signal, don't wait 30 s
      containers:
      - name: ops
        image: campus-app:1.0
        imagePullPolicy: Never
        command: ["sleep", "infinity"]
