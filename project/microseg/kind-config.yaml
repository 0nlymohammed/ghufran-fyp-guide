# kind cluster for the lab: 1 control-plane + 2 workers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true       # Cilium is installed instead
  kubeProxyMode: iptables       # kube-proxy stays, Cilium does not replace it
nodes:
- role: control-plane
  image: kindest/node:v1.36.4
- role: worker                  # will be named kind-worker
  image: kindest/node:v1.36.4
  labels:
    tier: frontend
  extraPortMappings:
  - containerPort: 30080        # NodePort of the frontend Service
    hostPort: 30080             # http://localhost:30080 in WSL and Windows
    listenAddress: "127.0.0.1"  # not reachable from the LAN
- role: worker                  # will be named kind-worker2
  image: kindest/node:v1.36.4
  labels:
    tier: backend
