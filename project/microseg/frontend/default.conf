# nginx for the Campus Portal: serves index.html and forwards /api and /news.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Look up service names at request time through kube-dns (10.96.0.10 in kind).
    # Full names are required: nginx's own resolver does not use the search list.
    resolver 10.96.0.10 valid=10s ipv6=off;

    proxy_http_version 1.1;      # the Cilium L7 proxy (Envoy) expects HTTP/1.1
    proxy_connect_timeout 5s;    # fail fast if a policy drops the connection

    location = /healthz {
        return 200 "ok\n";
    }

    location /api/ {
        set $api http://api.campus.svc.cluster.local:8080;
        proxy_pass $api;
    }

    location /news {
        set $news http://news.campus.svc.cluster.local:5000;
        proxy_pass $news;
    }
}
